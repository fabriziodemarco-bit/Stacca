# Sveglia per Supabase: il piano gratuito mette in pausa il progetto dopo 7 giorni senza attività.
# Ogni 3 giorni legge la tabellina "keepalive" (una riga, nessun dato personale), così il database resta acceso.
# URL e chiave pubblica stanno nei Secrets del repository (Settings > Secrets and variables > Actions).
name: Supabase sveglia

on:
  schedule:
    - cron: "0 8 */3 * *"   # alle 8:00 UTC, ogni 3 giorni
  workflow_dispatch:         # pulsante "Run workflow" per provarla a mano

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Legge la tabella keepalive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/keepalive?select=id"
